<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nashville Mobile Cuts - Contact</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .form-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-weight: 600;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        input[type="text"],
        input[type="tel"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        
        input[type="text"]:focus,
        input[type="tel"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .thanks-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #4CAF50;
            color: white;
            padding: 20px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .thanks-message.show {
            opacity: 1;
        }
        
        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Nashville Mobile Cuts</h1>
        <form id="leadForm">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
                <div class="error-message" id="nameError"></div>
            </div>
            
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" required>
                <div class="error-message" id="phoneError"></div>
            </div>
            
            <button type="submit" class="submit-btn" id="submitBtn">
                Submit
            </button>
        </form>
    </div>
    
    <div class="thanks-message" id="thanksMessage">
        Thanks!
    </div>

    <script>
        document.getElementById('leadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const nameInput = document.getElementById('name');
            const phoneInput = document.getElementById('phone');
            const nameError = document.getElementById('nameError');
            const phoneError = document.getElementById('phoneError');
            const thanksMessage = document.getElementById('thanksMessage');
            
            // Clear previous errors
            nameError.style.display = 'none';
            phoneError.style.display = 'none';
            
            // Get form data
            const formData = {
                name: nameInput.value.trim(),
                phone: phoneInput.value.trim()
            };
            
            // Basic validation
            if (!formData.name) {
                nameError.textContent = 'Name is required';
                nameError.style.display = 'block';
                return;
            }
            
            if (!formData.phone) {
                phoneError.textContent = 'Phone is required';
                phoneError.style.display = 'block';
                return;
            }
            
            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
            
            try {
                // Using Web3Forms - free service that works with any email
                const response = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        access_key: '46ce804a-e03b-44be-a8f1-896d62d35f47',
                        name: formData.name,
                        phone: formData.phone,
                        to: 'nashvillemobilecuts@gmail.com',
                        subject: 'New Lead from Nashville Mobile Cuts Website',
                        from_name: formData.name,
                        reply_to: 'nashvillemobilecuts@gmail.com'
                    })
                });
                
                if (response.ok) {
                    // Show thanks message
                    thanksMessage.classList.add('show');
                    
                    // Hide thanks message after 1 second
                    setTimeout(() => {
                        thanksMessage.classList.remove('show');
                    }, 1000);
                    
                    // Reset form
                    nameInput.value = '';
                    phoneInput.value = '';
                } else {
                    throw new Error('Failed to send message');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Sorry, there was an error sending your message. Please try again.');
            } finally {
                // Re-enable submit button
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit';
            }
        });
    </script>
</body>
</html>
